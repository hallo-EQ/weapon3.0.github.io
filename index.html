                //   - suffixBrackets: 放类别后面（包含版本关键字和选中的 suffix 括号）
                const titleBrackets = [];
                const suffixBrackets = [];
                const userChoseNone = !category;
                
                // 先处理 bracketParts 中的类别关键字（用于自动识别类别）
                for (const bp of bracketParts) {
                    const detected = detectCategoryFromText(bp);
                    if (detected && !userChoseNone) {
                        category = detected.value;
                    }
                }

                // 然后处理 item.innerBrackets 中的所有项
                for (const b of (item.innerBrackets || [])) {
                    const bp = b.text;
                    const info = { selected: b.selected, placement: b.placement || 'title' };
                    const detected = detectCategoryFromText(bp);
                    const isVersionKeyword = versionKeywordList.some(kw => bp.includes(kw));

                    // 类别关键字：已在上面处理过 category，这里跳过
                    if (detected && !userChoseNone) {
                        continue;
                    }

                    // 版本关键字：如果不在 extraBrackets 中，才添加到 suffixBrackets
                    if (isVersionKeyword && !hasVersionInExtra(bp)) {
                        suffixBrackets.push(bp);
                        continue;
                    }

                    // 如果是版本关键字且已在 extraBrackets 中，跳过（避免重复）
                    if (isVersionKeyword && hasVersionInExtra(bp)) {
                        continue;
                    }

                    // 选中的非版本关键字按 placement 分组
                    if (!info.selected) continue;
                    if (info.placement === 'title') {
                        titleBrackets.push(bp);
                    } else {
                        suffixBrackets.push(bp);
                    }
                }

                // 书名号内 = 标题 + placement='title' 的选中括号
                let titleWithBrackets = title;
                for (const tb of titleBrackets) {
                    titleWithBrackets += '（' + tb + '）';
                }

                // 如果勾选了"简化三级序号"，将 X.Y.Z 简化为 X.Y
                let finalIdx = idx;
                const simplifyIndexCheckbox = document.getElementById('simplifyIndex');
                if (simplifyIndexCheckbox && simplifyIndexCheckbox.checked && /^\d+\.\d+\.\d+$/.test(idx)) {
                    finalIdx = idx.replace(/^(\d+\.\d+)\.\d+$/, '$1');
                }

                let core = '';
                // 序号放在书名号前面；书名号内是标题+title位置的括号
                if (finalIdx) {
                    core += finalIdx + '《' + titleWithBrackets + '》';
                } else {
                    core += '《' + titleWithBrackets + '》';
                }
                // 类别：为空（"无"）时跳过不输出，否则加中文括号放在书名号之后
                if (category) {
                    core += '（' + category + '）';
                }
                // placement='suffix' 的选中括号内容放在类别后面，使用中文括号
                for (const sb of suffixBrackets) {
                    core += '（' + sb + '）';
                }
                // 从书名号外面提取的括号内容（extraBrackets）放在其后，使用中文括号
                if (item.extraBrackets && item.extraBrackets.length > 0) {
                    for (const bp of item.extraBrackets) {
                        core += '（' + bp + '）';
                    }
                }
                if (extra) {
                    // 如果extra已经带有括号（中文或英文），则直接加，否则加中文括号
                    if (extra.startsWith('（') || extra.startsWith('(')) {
                        core += extra;
                    } else {
                        core += '（' + extra + '）';
                    }
                }
                // 末尾编号（独立字段 item.suffixNumber）：不影响 extra，在最后追加独立的 （X） 括号
                // 用户填什么就输出什么括号（纯数字 → （1）；含括号则原样）
                if (item.suffixNumber && item.suffixNumber.trim()) {
                    const sn = item.suffixNumber.trim();
                    if (sn.startsWith('（') || sn.startsWith('(')) {
                        core += sn;
                    } else {
                        core += '（' + sn + '）';
                    }
                }
                // 替换所有下划线为空格
                core = core.replace(/_/g, ' ');

                // 扩展名
                const ext = getExtension(item.originalName);
                return core + (ext ? '.' + ext : '');
            }

            /**
             * 显示 Toast
             */
            function showToast(message, type = 'info', duration = 2800) {
                const toast = document.createElement('div');
                toast.className = 'toast ' + type;
                toast.textContent = message;
                toastContainer.appendChild(toast);
                setTimeout(() => {
                    toast.style.animation = 'fadeOut 0.3s ease forwards';
                    setTimeout(() => toast.remove(), 300);
                }, duration);
            }

            function isJSZipReady() {
                return typeof JSZip !== 'undefined';
            }

            // ===== 渲染 =====
            function renderList() {
                const isEmpty = fileItems.length === 0;
                fileCount.textContent = fileItems.length;
                fileCountBadge.textContent = fileItems.length + ' 个文件';
                toolbar.style.display = isEmpty ? 'none' : 'flex';
                footerActions.style.display = isEmpty ? 'none' : 'flex';
                chapterDropZone.style.display = isEmpty ? 'none' : 'flex';

                if (isEmpty) {
                    fileList.innerHTML = `
                        <div class="empty-state">
                            <span class="icon">📭</span>
                            <p>暂无文件，请上传</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                fileItems.forEach((item, idx) => {
                    console.log('[renderList] item:', {
                        id: item.id,
                        originalName: item.originalName,
                        title: item.title,
                        category: item.category,
                        extraBrackets: item.extraBrackets,
                        innerBrackets: item.innerBrackets ? item.innerBrackets.map(ib => ({text: ib.text, placement: ib.placement, selected: ib.selected})) : null
                    });
                    const newName = generateNewName(item);
                    const escapedIndex = item.index.replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g,
                    '&gt;');
                    const escapedTitle = item.title.replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g,
                        '&gt;');
                    const escapedOrig = item.originalName.replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g,
                        '&gt;');
                    const isFirst = idx === 0;
                    const isLast = idx === fileItems.length - 1;

                    // 保存状态图标 & 行样式
                    const status = item.saveStatus || 'idle';
                    let statusIcon = '○';
                    let statusTooltip = '未保存';
                    if (status === 'saving') { statusIcon = '⏳'; statusTooltip = '保存中...'; }
                    else if (status === 'success') { statusIcon = '✓'; statusTooltip = '保存成功'; }
                    else if (status === 'fail') { statusIcon = '✕'; statusTooltip = '保存失败，点击重试：' + (item.saveError || ''); }
                    const rowClass =
                        status === 'fail' ? 'fail-row' :
                        status === 'success' ? 'success-row' : '';

                    // 生成 extraBrackets 的可编辑标签
                    const extraBrackets = item.extraBrackets || [];
                    let bracketTagsHtml = '';
                    if (extraBrackets.length > 0) {
                        bracketTagsHtml = '<div class="bracket-tags">' +
                            extraBrackets.map((b, i) =>
                                `<span class="bracket-tag" data-idx="${i}">${b}<span class="bracket-tag-remove">×</span></span>`
                            ).join('') +
                            '<span class="bracket-tag bracket-tag-add" title="添加括号内容">+</span>' +
                            '</div>';
                    } else {
                        bracketTagsHtml = '<div class="bracket-tags"><span class="bracket-tag bracket-tag-add" title="添加括号内容">+</span></div>';
                    }

                    // 生成 innerBrackets 待选标签（按 placement 分组显示）
                    const innerBrackets = item.innerBrackets || [];
                    let innerBracketsHtml = '';
                    if (innerBrackets.length > 0) {
                        // 按 placement 分组
                        const titleGroup = innerBrackets.filter(b => b.placement === 'title');
                        const suffixGroup = innerBrackets.filter(b => b.placement === 'suffix');

                        // 蓝框：放书名号内
                        if (titleGroup.length > 0) {
                            innerBracketsHtml += '<div class="inner-brackets-row ib-title-group">';
                            innerBracketsHtml += '<span class="ib-label ib-blue">📖 书名号内:</span>';
                            innerBracketsHtml += titleGroup.map(b => {
                                const i = innerBrackets.indexOf(b);
                                const sel = b.selected ? 'selected' : 'unselected';
                                return `<span class="inner-bracket-tag ${sel} ib-title-tag" data-ib-idx="${i}" title="放书名号内（点击切换选中）">${b.text}<span class="ib-toggle-placement" data-ib-idx="${i}" title="移动到类别后" data-target="suffix">➤</span><span class="ib-remove" data-ib-idx="${i}" title="删除">×</span></span>`;
                            }).join('');
                            innerBracketsHtml += '</div>';
                        }

                        // 红框：放类别后面
                        if (suffixGroup.length > 0) {
                            innerBracketsHtml += '<div class="inner-brackets-row ib-suffix-group">';

            // ===== 增删改 =====

            /**
             * 递归读取 FileSystemDirectoryEntry 下所有文件，平铺到 files 数组
             * 给每个 File 设置 webkitRelativePath（保留目录结构，配合 saveSingleFile 子目录逻辑）
             * @param {FileSystemDirectoryEntry} entry 目录入口
             * @param {Array<File>} files 累积文件数组
             * @param {string} prefix 当前相对路径前缀（如 "细胞呼吸" 或 "细胞呼吸/子目录"）
             * @returns {Promise<void>}
             */
            function traverseDirectory(entry, files, prefix) {
                return new Promise(resolve => {
                    console.log('[traverseDirectory] 开始:', prefix);
                    const reader = entry.createReader();
                    const allEntries = [];
                    let stopped = false;
                    // readEntries 一次最多返回 100 条，要循环读取直到返回空数组
                    const readBatch = () => {
                        if (stopped) return;
                        try {
                            reader.readEntries(async (entries) => {
                                if (!entries || entries.length === 0) {
                                    // 全部读完，处理累积的 entries
                                    console.log('[traverseDirectory] readEntries 完成:', prefix, 'entries count:', allEntries.length);
                                    stopped = true;
                                    await processEntries();
                                    resolve();
                                    return;
                                }
                                // 累积本批次结果，继续读下一批
                                for (const ent of entries) allEntries.push(ent);
                                readBatch();
                            }, err => {
                                // 读取失败：已累积的条目仍要处理
                                console.warn('[traverseDirectory] readEntries 失败:', prefix, err);
                                stopped = true;
                                processEntries().then(() => resolve());
                            });
                        } catch (e) {
                            console.error('[traverseDirectory] readEntries 异常:', prefix, e);
                            stopped = true;
                            processEntries().then(() => resolve());
                        }
                    };
                    async function processEntries() {
                        const promises = [];
                        for (const ent of allEntries) {
                            if (ent.isDirectory) {
                                promises.push(traverseDirectory(ent, files, prefix + '/' + ent.name));
                            } else if (ent.isFile) {
                                promises.push(new Promise(res => {
                                    try {
                                        ent.file(f => {
                                            try {
                                                Object.defineProperty(f, 'webkitRelativePath', {
                                                    value: prefix + '/' + ent.name,
                                                    configurable: true
                                                });
                                            } catch (_) {}
                                            files.push(f);
                                            res();
                                        }, err => {
                                            console.warn('[traverseDirectory] file() 失败:', ent.name, err);
                                            // 即使读取失败也要 resolve，避免阻塞
                                            res();
                                        });
                                    } catch (e) {
                                        console.warn('[traverseDirectory] ent.file 异常:', ent.name, e);
                                        res();
                                    }
                                }));
                            }
                        }
                        await Promise.all(promises);
                    }
                    readBatch();
                });
            }

            function addFiles(files) {
                let added = 0;
                for (const file of files) {
                    // 简单去重
                    const dup = fileItems.some(it => it.originalName === file.name && it.file.size === file.size);
                    if (dup) {
                        showToast(`⏭ 跳过重复: ${file.name}`, 'info', 1200);
                        continue;
                    }
                    // 解析时只用最后一段文件名（避免路径分隔符污染 parseIndexAndTitle/detectCategory）
                    const nameForParse = file.name || (file.webkitRelativePath ? file.webkitRelativePath.split('/').pop() : '');
                    // 顶层文件夹名（仅文件夹上传时有）：webkitRelativePath 形如 "章节1/01.pptx"
                    let sourceFolder = '';
                    // 完整相对路径（含子目录），用于保存时重建目录结构
                    let relativePath = '';
                    if (file.webkitRelativePath) {
                        relativePath = file.webkitRelativePath;
                        if (relativePath.indexOf('/') > 0) {
                            sourceFolder = relativePath.split('/')[0];
                        }
                    }
                    const { index, title, extraBrackets, innerBrackets } = parseIndexAndTitle(nameForParse, sourceFolder);
                    // 自动识别类别：文件名含"教学设计/导学案/作业/课件/PPT"等关键字时覆盖全局默认
                    let extraBracketsClean = (extraBrackets || []).slice();
                    // innerBrackets 已经在 extractInnerBrackets 中做了拆分处理
                    // （类别关键字已被移除，剩余内容保留）
                    let innerBracketsClean = (innerBrackets || []).slice();
                    let category = globalCategory.value;
                    // 类别识别：先扫描文件名，再扫描来源文件夹名（括号内容常在文件夹名中，如"第1章（单元测试·基础卷）"）
                    const detected = detectCategory(nameForParse) || (sourceFolder ? detectCategory(sourceFolder) : null);
                    if (detected) {
                        category = detected.value;
                        // 把命中类别的那一项从 extraBrackets 里剥离（大小写不敏感），避免重复输出
                        const keyRe = new RegExp('^' + detected.matchedKey.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '$', 'i');
                        extraBracketsClean = extraBracketsClean.filter(b => !keyRe.test(b.trim()));
                        // 注意：不再从 innerBrackets 中移除类别关键字
                        // 因为 extractInnerBrackets 已经做了拆分处理，
                        // 类别关键字已被移除，剩余内容（如"表格式逐字稿"）会保留在 innerBrackets 中
                    }
                    const extra = '';
                    fileItems.push({
                        id: String(++idCounter),
                        file: file,
                        originalName: nameForParse,
                        sourceFolder: sourceFolder,    // 来源顶层文件夹名（仅文件夹上传时有，否则为空字符串）
                        relativePath: relativePath,    // 完整相对路径（含子目录），保存时用于重建目录结构
                        index: index,
                        title: title,
                        category: category,
                        extra: extra,
                        suffixNumber: '',   // 独立末尾编号（不影响 extra），如 "1" → 输出 (1)
                        extraBrackets: extraBracketsClean,
                        innerBrackets: innerBracketsClean,   // 从书名号内提取的待选括号内容 [{text, selected, placement}]（已剥离类别关键字）
                        saveStatus: 'idle',    // idle | saving | success | fail
                        saveError: '',
                    });
                    added++;
                }
                if (added > 0) {
                    renderList();
                    showToast(`✅ 成功添加 ${added} 个文件`, 'success');
                } else if (files.length > 0) {
                    showToast('⚠️ 没有新文件被添加（可能重复）', 'info');
                }
            }

            function removeFile(id) {
                const idx = fileItems.findIndex(it => it.id === id);
                if (idx === -1) return;
                fileItems.splice(idx, 1);
                renderList();
                showToast('已移除', 'info', 1200);
            }

            function clearAll() {
                if (fileItems.length === 0) return;
                if (confirm('确定清空所有文件吗？')) {
                    fileItems = [];
                    window.fileItems = fileItems;
                    renderList();
                    showToast('🗑 已清空', 'info');
                }
            }

            /**
             * 上移/下移文件
             */
            function moveFile(id, direction) {
                const idx = fileItems.findIndex(it => it.id === id);
                if (idx === -1) return;
                if (direction === 'up' && idx === 0) return;
                if (direction === 'down' && idx === fileItems.length - 1) return;
                const targetIdx = direction === 'up' ? idx - 1 : idx + 1;
                // 交换
                const tmp = fileItems[idx];
                fileItems[idx] = fileItems[targetIdx];
                fileItems[targetIdx] = tmp;
                renderList();
            }

            /**
             * 自动编号：按当前顺序给所有文件填序号
             */
            function applyAutoIndex() {
                if (fileItems.length === 0) {
                    showToast('⚠️ 没有文件可编号', 'info');
                    return;
                }
                const format = autoIndexFormat.value; // '1' | '01' | '1.1' | '1-1'
                const startRaw = parseInt(autoIndexStart.value, 10);
                const start = isNaN(startRaw) || startRaw < 1 ? 1 : startRaw;

                fileItems.forEach((item, i) => {
                    const n = start + i;
                    let idxStr = '';
                    switch (format) {
                        case '01':
                            idxStr = String(n).padStart(2, '0');
                            break;
                        case '1.1':
                            idxStr = '1.' + n;
                            break;
                        case '1-1':
                            idxStr = '1-' + n;
                            break;
                        case '1':
                        default:
                            idxStr = String(n);
                    }
                    item.index = idxStr;
                });
                renderList();
                const sample = fileItems[Math.min(2, fileItems.length - 1)];
                showToast(`🔢 已按 ${format==='01'?'01,02…':format==='1.1'?'1.1,1.2…':format==='1-1'?'1-1,1-2…':'1,2,3…'} 自动编号（从 ${start} 开始）`, 'success', 1800);
            }

            /**
             * 固定格式编号：以输入的编号为模板，前缀固定、末位递增
             * 如输入 2.1 → 2.1, 2.2, 2.3…
             * 如输入 2-1 → 2-1, 2-2, 2-3…
             * 如输入 2.1.1 → 2.1.1, 2.1.2, 2.1.3…
             * 如输入 5 → 5, 6, 7…
             */
            function applyFixedIndex() {
                if (fileItems.length === 0) {
                    showToast('⚠️ 没有文件可编号', 'info');
                    return;
                }
                const pattern = (fixedIndexPattern.value || '').trim();
                if (!pattern) {
                    showToast('⚠️ 请输入编号模板，如 2.1', 'info');
                    fixedIndexPattern.focus();
                    return;
                }
                // 解析模板：可选前缀（以 . 或 - 结尾）+ 末位起始数字
                const m = pattern.match(/^([\d]+(?:[.\-][\d]+)*[.\-])?(\d+)$/);
                if (!m) {
                    showToast('⚠️ 格式不正确，示例：2.1、2-1、2.1.1、5', 'error');
                    fixedIndexPattern.focus();
                    return;
                }
                const prefix = m[1] || '';
                const start = parseInt(m[2], 10);

                fileItems.forEach((item, i) => {
                    item.index = prefix + (start + i);
                });
                renderList();
                showToast(`📌 已固定格式 ${prefix}X 从 ${start} 开始编号`, 'success', 1800);
            }

            /**
             * 统一编号：所有文件使用同一个编号（不递增）
             * 如输入 2.1 → 全部文件序号都是 2.1
             */
            function applyFixedIndexNoIncrement() {
                if (fileItems.length === 0) {
                    showToast('⚠️ 没有文件可编号', 'info');
                    return;
                }
                const pattern = (fixedIndexPattern.value || '').trim();
                if (!pattern) {
                    showToast('⚠️ 请输入编号，如 2.1', 'info');
                    fixedIndexPattern.focus();
                    return;
                }
                // 原样应用到全部，不做递增
                fileItems.forEach(item => {
                    item.index = pattern;
                });
                renderList();
                showToast(`📎 已将编号 ${pattern} 统一应用到全部（不递增）`, 'success', 1800);
            }

            /**
             * 自动识别类别：扫描所有文件名关键字，匹配则覆盖类别并剥离重复关键字
             * 已有手动指定的类别会被识别结果覆盖；未识别的行保持不变
             */
            function applyAutoCategory() {
                if (fileItems.length === 0) {
                    showToast('⚠️ 没有文件可识别', 'info');
                    return;
                }
                let matched = 0;
                fileItems.forEach(item => {
                    // 先扫描文件名，再扫描来源文件夹名（括号内容常在文件夹名中）
                    const detected = detectCategory(item.originalName) || (item.sourceFolder ? detectCategory(item.sourceFolder) : null);
                    if (detected) {
                        item.category = detected.value;
                        // 从 extraBrackets 里剥离命中类别的那一项关键字（大小写不敏感），避免重复输出
                        const keyRe = new RegExp('^' + detected.matchedKey.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '$', 'i');
                        if (item.extraBrackets && item.extraBrackets.length > 0) {
                            item.extraBrackets = item.extraBrackets.filter(b => !keyRe.test((b || '').trim()));
                        }
                        matched++;
                    }
                });
                renderList();
                if (matched > 0) {
                    showToast(`🤖 已识别 ${matched} / ${fileItems.length} 个文件的类别`, 'success', 2200);
                } else {
                    showToast('🔍 未识别到任何类别关键字（教学设计/导学案/作业/课件/PPT 等）', 'info', 2800);
                }
            }

            /**
             * 弹出"批量加末尾编号"模态窗：填一个数字，应用到所有文件的 suffixNumber（独立字段，不影响 extra）
             * 用户可在行内"编号"输入框单独改某些行（不需要的留空即可）
             */
            function showSuffixModal() {
                if (fileItems.length === 0) {
                    showToast('⚠️ 没有文件可应用，请先上传', 'info');
                    return;
                }
                const mask = document.createElement('div');
                mask.className = 'fail-detail-modal-mask';
                mask.innerHTML = `
                    <div class="fail-detail-modal" style="max-width:440px;">
                        <div class="modal-header">
                            <h3>🔢 批量加末尾编号</h3>

                        </div>
                        <div class="modal-body">
                            <div style="margin-bottom:12px; font-size:13px; color:var(--gray-6);">
                                填一个数字，给所有文件的<strong>末尾追加独立的 (X) 括号</strong>。
                                <br>这是<strong>独立字段</strong>，<strong>不会覆盖</strong>现有的"附加"内容（如"解析版"会保留，输出 (解析版)(X)）。
                            </div>
                            <div style="padding:10px 12px; background:var(--gray-1); border-radius:8px;">
                                <label style="display:flex; align-items:center; gap:8px;">
                                    <span style="white-space:nowrap;">末尾编号:</span>
                                    <input type="text" id="suffixNum" value="1" placeholder="如 1、2" style="flex:1;" />
                                </label>
                            </div>
                            <div style="margin-top:10px; padding:8px 10px; background:#f0fdf4; border:1px solid #bbf7d0; border-radius:6px; font-size:11px; color:#15803d;">
                                ✅ 不需要的行可在列表"编号"输入框单独清空。共 ${fileItems.length} 个文件。
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-outline" id="suffixClearBtn">🚫 清空全部编号</button>
                            <button class="btn btn-outline" data-close-modal>取消</button>
                            <button class="btn btn-primary" id="suffixApplyBtn">应用</button>
