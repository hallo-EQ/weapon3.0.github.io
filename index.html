                document.body.appendChild(mask);

                const close = () => mask.remove();
                mask.addEventListener('click', e => { if (e.target === mask) close(); });
                mask.querySelector('.modal-close').addEventListener('click', close);
                mask.querySelector('[data-close-modal]').addEventListener('click', close);

                // 应用：把输入值设到所有文件的 suffixNumber（不动 extra）
                mask.querySelector('#suffixApplyBtn').addEventListener('click', function () {
                    const val = mask.querySelector('#suffixNum').value.trim();
                    applySuffixNumber(val);
                    close();
                });
                // 清空全部编号
                mask.querySelector('#suffixClearBtn').addEventListener('click', function () {
                    applySuffixNumber('');
                    close();
                });
            }

            /**
             * 批量设置末尾编号（写入 item.suffixNumber，generateNewName 会输出独立的 (X) 括号，不影响 extra）
             * @param {string} val - 编号内容（如 "1"、"2"，留空则清空）
             */
            function applySuffixNumber(val) {
                if (fileItems.length === 0) {
                    showToast('⚠️ 没有文件可应用', 'info');
                    return;
                }
                const v = (val || '').trim();
                fileItems.forEach(it => { it.suffixNumber = v; });
                if (v) {
                    showToast(`🔢 已给全部 ${fileItems.length} 个文件加末尾编号 (${v})，不影响"附加"内容`, 'success', 2500);
                } else {
                    showToast(`🚫 已清空全部末尾编号`, 'success');
                }
                renderList();
            }

            // ===== 全局应用 =====
            function applyGlobalToAll() {
                if (fileItems.length === 0) {
                    showToast('⚠️ 没有文件可应用', 'info');
                    return;
                }
                const cat = globalCategory.value;
                const extra = globalExtra.value.trim();
                fileItems.forEach(item => {
                    item.category = cat;
                    item.extra = extra;
                });
                renderList();
                showToast(`✅ 已应用类别“${cat}”${extra ? '和附加“' + extra + '”' : ''}到全部文件`, 'success');
            }

            // ============================================================
            // 章节图自动编号：上传图片 → OCR 识别章节列表 → 按标题匹配文件
            // ============================================================
            const TESSERACT_CDN = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';

            /**
             * 懒加载 Tesseract.js（只加载一次）
             */
            function loadTesseract() {
                if (tesseractLoadingPromise) return tesseractLoadingPromise;
                tesseractLoadingPromise = new Promise((resolve, reject) => {
                    if (typeof window.Tesseract !== 'undefined') {
                        resolve(window.Tesseract);
                        return;
                    }
                    const s = document.createElement('script');
                    s.src = TESSERACT_CDN;
                    s.onload = () => {
                        if (typeof window.Tesseract !== 'undefined') {
                            resolve(window.Tesseract);
                        } else {
                            reject(new Error('Tesseract.js 加载后未找到全局对象'));
                        }
                    };
                    s.onerror = () => reject(new Error('Tesseract.js 加载失败，请检查网络'));
                    document.head.appendChild(s);
                });
                return tesseractLoadingPromise;
            }

            /**
             * 对图片文件做 OCR（中文 chi_sim + eng）
             * @param {File} imageFile
             * @param {(p:number, status:string)=>void} [onProgress]
             * @returns {Promise<string>} 识别到的文本
             */
            async function runOcr(imageFile, onProgress) {
                const Tesseract = await loadTesseract();
                // Tesseract.js v5 API
                const worker = await Tesseract.createWorker(['chi_sim', 'eng'], 1, {
                    logger: (m) => {
                        if (onProgress && m && typeof m.progress === 'number') {
                            onProgress(m.progress, m.status || '');
                        }
                    }
                });
                try {
                    const { data } = await worker.recognize(imageFile);
                    return data && data.text ? data.text : '';
                } finally {
                    try { await worker.terminate(); } catch (e) { /* ignore */ }
                }
            }

            /**
             * 把中文数字转成阿拉伯数字（一→1，十二→12）
             */
            function chineseNumToArabic(s) {
                const map = { '零':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10 };
                if (!s) return '';
                if (/^\d+$/.test(s)) return String(parseInt(s, 10));
                if (s === '十') return '10';
                if (s.length === 2 && s[0] === '十') return '1' + (map[s[1]] !== undefined ? map[s[1]] : ''); // 十一→11
                if (s.length === 2 && s[1] === '十') return (map[s[0]] !== undefined ? map[s[0]] : '') + '0';  // 二十→20
                if (s.length === 3 && s[1] === '十') {
                    const a = map[s[0]] !== undefined ? map[s[0]] : '';
                    const b = map[s[2]] !== undefined ? map[s[2]] : '';
                    return a + b; // 二十一→21
                }
                // 逐字符相加（简单情况）
                let n = 0;
                for (const ch of s) {
                    if (map[ch] !== undefined) n = n * 10 + map[ch];
                }
                return n ? String(n) : '';
            }

            /**
             * 从 OCR 文本中解析章节列表（支持层级结构：大标题+小标题）
             * 支持的行格式：
             *   层级结构：一 小数的意义和加减法 → 小数的意义（一）/ 小数的意义（二）/ ...
             *   数字编号：1.1 直线与圆 / 1.1、直线与圆 / 1.1.直线与圆
             *   第X章/节/讲 标题
             * @returns {Array<{index:string, title:string, isLarge:boolean, parentIndex?:string}>}
             */
            function parseChaptersFromText(text) {
                if (!text) return [];
                const lines = text.split(/\r?\n/);
                const rawChapters = []; // 先解析原始行
                // 数字编号：1.1 / 1.1.1 / 1 开头
                const numRe = /^\s*(\d+(?:\.\d+)*)\s*[、.．:：)）\s]*\s*(.+?)\s*$/;
                // 第X章/节/讲 标题
                const zhRe = /^\s*第\s*([一二三四五六七八九十百零\d]+)\s*[章节讲课]\s*[、.．:：)）\s]*\s*(.+?)\s*$/;
                // 大标题：以中文数字开头（可选 □ 前缀），如 "一 小数的意义和加减法"、"□ 一 认识三角形"
                const largeRe = /^\s*(?:[□■◇◆○●\s]*\s*)?([一二三四五六七八九十百]+)\s*(.+?)\s*$/;
                
                // 第一遍：扫描所有行，识别大标题和小标题
                let currentLarge = null;
                const largeSections = []; // { index, title, startIdx }
                const lineResults = []; // 每行解析结果
                
                for (let i = 0; i < lines.length; i++) {
                    const raw = lines[i];
                    const line = raw.trim();
                    if (!line || line.length < 2) {
                        lineResults.push(null);
                        continue;
                    }

                    // 尝试匹配大标题
                    let largeMatch = line.match(largeRe);
                    // 过滤：大标题必须以中文数字开头，且标题部分有实际内容（不是纯章节行）
                    if (largeMatch && largeMatch[1] && largeMatch[2] && largeMatch[2].length >= 2) {
                        const zhNum = largeMatch[1];
                        const arabic = chineseNumToArabic(zhNum);
                        const title = largeMatch[2].trim().replace(/[、.．:：]+$/, '').trim();
                        // 排除可能的误判：如果标题部分包含"课时/节/讲"，更可能是小标题
                        if (!/课时|节|讲$/.test(title)) {
                            currentLarge = { index: arabic || zhNum, title: title, startIdx: rawChapters.length, children: [] };
                            largeSections.push(currentLarge);
                            lineResults.push({ type: 'large', index: currentLarge.index, title: title });
                            rawChapters.push({ index: currentLarge.index, title: title, isLarge: true });
                            continue;
                        }
                    }

                    // 尝试匹配数字编号
                    let m = line.match(numRe);
                    if (m) {
                        const idx = m[1];
                        let title = m[2].trim();
                        title = title.replace(/[、.．:：]+$/, '').trim();
                        if (!title) { lineResults.push(null); continue; }
                        const entry = { index: idx, title: title, isLarge: false };
                        if (currentLarge) {
                            entry.parentIndex = currentLarge.index;
                            // 重新编号：如果小标题已有数字编号，保留原编号；否则按顺序
                            if (!/\./.test(idx)) {
                                // 纯数字编号，需要重新编号为层级格式
                                const childNum = currentLarge.children.length + 1;
                                entry.index = currentLarge.index + '.' + childNum;
                            }
                            currentLarge.children.push(entry);
                        }
                        lineResults.push({ type: 'small', entry });
                        rawChapters.push(entry);
                        continue;
                    }

                    // 尝试匹配第X章/节/讲
                    m = line.match(zhRe);
                    if (m) {
                        const num = chineseNumToArabic(m[1]);
                        let title = m[2].trim().replace(/[、.．:：]+$/, '').trim();
                        if (!title) { lineResults.push(null); continue; }
                        const entry = { index: num || '1', title: title, isLarge: false };
                        if (currentLarge) {
                            entry.parentIndex = currentLarge.index;
                            const childNum = currentLarge.children.length + 1;
                            entry.index = currentLarge.index + '.' + childNum;
                            currentLarge.children.push(entry);
                        }
                        lineResults.push({ type: 'small', entry });
                        rawChapters.push(entry);
                        continue;
                    }

                    // 纯文本行：如果当前有大标题，归为小标题（按顺序编号）
                    if (currentLarge && line.length >= 2) {
                        const title = line.replace(/[、.．:：]+$/, '').trim();
                        if (title) {
                            const childNum = currentLarge.children.length + 1;
                            const entry = {
                                index: currentLarge.index + '.' + childNum,
                                title: title,
                                isLarge: false,
                                parentIndex: currentLarge.index
                            };
                            currentLarge.children.push(entry);
                            lineResults.push({ type: 'small', entry });
                            rawChapters.push(entry);
                            continue;
                        }
                    }

                    lineResults.push(null);
                }

                return rawChapters;
            }

            /**
             * 标题归一化用于匹配：去空格/标点/书名号/括号/小写
             */
            function normalizeForMatch(s) {
                if (!s) return '';
                return String(s)
                    .replace(/[《》「」『』]/g, '')
                    .replace(/[（(]/g, '(')
                    .replace(/[）)]/g, ')')
                    .replace(/[\s_\-—·・,，。.．、:：;；!！?？'"]/g, '')
                    .toLowerCase();
            }

            /**
             * 简单相似度：包含关系优先，否则用字符重叠率
             */
            function similarity(a, b) {
                const na = normalizeForMatch(a);
                const nb = normalizeForMatch(b);
                if (!na || !nb) return 0;
                if (na === nb) return 1;
                // 包含关系给高分
                if (na.includes(nb) || nb.includes(na)) {
                    return 0.9 + 0.1 * Math.min(na.length, nb.length) / Math.max(na.length, nb.length);
                }
                // 字符重叠率
                const setA = new Set(na);
                let common = 0;
                for (const ch of setA) {
                    if (nb.includes(ch)) common++;
                }
                return common / Math.max(setA.size, new Set(nb).size);
            }

            /**
             * 把文件按标题匹配到章节，自动填 index
             * @param {Array<{index:string,title:string}>} chapters
             * @returns {{matched:Array, unmatched:Array, multi:Array}} 匹配结果
             */
            function matchFilesToChapters(chapters) {
                const matched = [];
                const unmatched = [];
                const usedChapters = new Set();
                
                // 分离大标题和小标题：优先用小标题匹配
                const smallChapters = chapters.filter(c => !c.isLarge);
                const largeChapters = chapters.filter(c => c.isLarge);
                
                // 1) 先按归一化标题做精确分组
                const groups = new Map();
                for (const item of fileItems) {
                    const key = normalizeForMatch(item.title);
                    if (!key) { unmatched.push(item); continue; }
                    if (!groups.has(key)) groups.set(key, []);
                    groups.get(key).push(item);
                }
                // 2) 模糊合并：相似度 >= 0.85 的组合并
                const groupList = [];
                for (const [key, items] of groups) {
                    groupList.push({ key, items });
                }
                for (let i = 0; i < groupList.length; i++) {
                    if (groupList[i] == null) continue;
                    for (let j = i + 1; j < groupList.length; j++) {
                        if (groupList[j] == null) continue;
                        const s = similarity(groupList[i].items[0].title, groupList[j].items[0].title);
                        if (s >= 0.85) {
                            groupList[i].items.push(...groupList[j].items);
                            groupList[j] = null;
                        }
                    }
                }
                
                // 3) 两轮匹配：先小标题，再大标题
                const pendingGroups = [];
                for (const g of groupList) {
                    if (g == null) continue;
                    const representative = g.items[0];
                    
                    // 第一轮：在小标题中找最佳匹配
                    let best = findBestMatch(representative.title, smallChapters, usedChapters, 0.35);
                    // 第二轮：如果小标题没匹配到，在大标题中找
                    if (!best) {
                        best = findBestMatch(representative.title, largeChapters, usedChapters, 0.35);
                    }
                    
                    if (best) {
                        usedChapters.add(best.ci);
                        for (const it of g.items) {
                            it.index = best.ch.index;
                            matched.push({ item: it, chapter: best.ch, score: best.score });
                        }
                    } else {
                        for (const it of g.items) unmatched.push(it);
                    }
                }
                return { matched, unmatched };
            }
            
            // 辅助函数：在章节列表中找最佳匹配
            function findBestMatch(title, chapterList, usedSet, minScore) {
                const scores = chapterList
                    .map((ch) => ({ key: (ch.isLarge ? 'L:' : 'S:') + ch.index, ch, score: similarity(title, ch.title) }))
                    .sort((a, b) => b.score - a.score);
                for (const s of scores) {
                    if (s.score < minScore) break;
                    if (!usedSet.has(s.key)) {
                        return { ci: s.key, ch: s.ch, score: s.score };
                    }
                }
                return null;
            }

            /**
             * 显示章节识别弹窗（可编辑 OCR 结果）+ 确认匹配
             * @param {string} imageDataUrl 图片预览
             * @param {Array<{index:string,title:string}>} chapters OCR 解析出的章节
             */
            function showChapterModal(imageDataUrl, chapters) {
                const old = document.querySelector('.chapter-modal-mask');
                if (old) old.remove();

                let rows = chapters.length ? chapters.slice() : [{ index: '', title: '' }];

                const mask = document.createElement('div');
                mask.className = 'chapter-modal-mask';
                mask.innerHTML = `
                    <div class="chapter-modal">
                        <div class="modal-header">
                            <div>
                                <h3>📸 章节识别结果</h3>
                                <div class="sub">下面是从图片识别出的章节列表，可手动修正后再匹配文件</div>
                            </div>
                            <button class="modal-close" title="关闭">×</button>
                        </div>
                        <div class="modal-body">
                            ${(() => {
                                const thumbs = Array.isArray(imageDataUrl) ? imageDataUrl : (imageDataUrl ? [imageDataUrl] : []);
                                if (thumbs.length === 0) return '';
                                if (thumbs.length === 1) return `<img src="${thumbs[0]}" class="chapter-preview-thumb" alt="章节图预览" />`;
                                return `<div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;">${thumbs.map(t => `<img src="${t}" class="chapter-preview-thumb" style="max-width:100px;max-height:70px;" alt="章节图预览" />`).join('')}</div>`;
                            })()}
                            <div class="chapter-rows"></div>
                            <button class="btn btn-outline btn-sm" id="chAddRow" style="margin-top:6px;">+ 新增一行</button>
                        </div>
                        <div class="modal-footer">
                            <span class="footer-info" id="chFooterInfo">共 ${rows.length} 个章节 · 当前 ${fileItems.length} 个文件待匹配</span>
                            <div class="footer-btns">
                                <button class="btn btn-outline" id="chCancel">取消</button>
                                <button class="btn btn-primary" id="chConfirm">确认匹配并编号</button>
                            </div>
                        </div>
                    </div>
                `;
                document.body.appendChild(mask);

                const rowsContainer = mask.querySelector('.chapter-rows');
                const footerInfo = mask.querySelector('#chFooterInfo');

                function renderRows() {
                    rowsContainer.innerHTML = rows.map((r, i) => `
                        <div class="chapter-row ${r.isLarge ? 'chapter-row-large' : ''}" data-i="${i}" style="${r.isLarge ? 'background:#eef2ff;font-weight:bold;border-left:3px solid #6366f1;' : ''}">
                            <input class="ch-idx" type="text" value="${(r.index || '').replace(/"/g, '&quot;')}" placeholder="${r.isLarge ? '大标题编号 如 1' : '编号 如 1.1'}" style="${r.isLarge ? 'background:#f5f3ff;' : ''}" />
                            <input class="ch-title" type="text" value="${(r.title || '').replace(/"/g, '&quot;')}" placeholder="章节标题" />
                            <button class="ch-del" title="删除此行">×</button>
                        </div>
                    `).join('');
                    footerInfo.textContent = `共 ${rows.length} 个章节 · 当前 ${fileItems.length} 个文件待匹配`;
                }
                renderRows();

                // 输入更新
                rowsContainer.addEventListener('input', function(e) {
                    const row = e.target.closest('.chapter-row');
                    if (!row) return;
                    const i = parseInt(row.dataset.i, 10);
                    if (isNaN(i)) return;
                    if (e.target.classList.contains('ch-idx')) rows[i].index = e.target.value;
                    else if (e.target.classList.contains('ch-title')) rows[i].title = e.target.value;
                });

                // 删除行
                rowsContainer.addEventListener('click', function(e) {
                    if (!e.target.classList.contains('ch-del')) return;
                    const row = e.target.closest('.chapter-row');
                    const i = parseInt(row.dataset.i, 10);
                    if (!isNaN(i)) { rows.splice(i, 1); renderRows(); }
                });

                // 新增行
                mask.querySelector('#chAddRow').addEventListener('click', function() {
                    rows.push({ index: '', title: '' });
                    renderRows();
                    rowsContainer.lastElementChild && rowsContainer.lastElementChild.querySelector('.ch-title').focus();
                });

                const close = () => mask.remove();
                mask.addEventListener('click', e => { if (e.target === mask) close(); });
                mask.querySelector('.modal-close').addEventListener('click', close);
                mask.querySelector('#chCancel').addEventListener('click', close);

                // 确认匹配
                mask.querySelector('#chConfirm').addEventListener('click', function() {
                    // 过滤掉空行，保留 isLarge 标志
                    const cleanChapters = rows
                        .map(r => ({ index: (r.index || '').trim(), title: (r.title || '').trim(), isLarge: !!r.isLarge }))
                        .filter(r => r.title);
                    if (cleanChapters.length === 0) {
                        showToast('⚠️ 没有可用的章节，请先填写或修正识别结果', 'info');
                        return;
                    }
                    if (fileItems.length === 0) {
                        showToast('⚠️ 还没有上传文件，请先上传文件再匹配', 'info');
                        return;
                    }
                    close();
                    const { matched, unmatched } = matchFilesToChapters(cleanChapters);
                    renderList();
                    if (unmatched.length === 0) {
                        showToast(`🎉 全部 ${matched.length} 个文件已匹配到章节并编号`, 'success', 3000);
                    } else {
                        showToast(`✅ 已匹配 ${matched.length} 个，未匹配 ${unmatched.length} 个（请手动填编号）`, 'info', 3500);
                    }
                });
            }

            /**
             * 处理上传的章节图片（支持多张）：OCR → 解析 → 弹窗
             */
            async function handleChapterImages(files) {
                if (!files || files.length === 0) return;
                const imageFiles = files.filter(f => f.type.startsWith('image/'));
                if (imageFiles.length === 0) {
                    showToast('❌ 请上传图片文件（png/jpg 等）', 'error');
                    return;
                }
                if (fileItems.length === 0) {
                    showToast('⚠️ 请先上传要编号的文件，再上传章节图', 'info');
                    return;
                }

                // 进度弹窗
                const mask = document.createElement('div');
                mask.className = 'chapter-modal-mask';
                mask.innerHTML = `
                    <div class="chapter-modal" style="max-width:500px;">
                        <div class="modal-header">
                            <div><h3>📸 正在识别章节…</h3><div class="sub">共 ${imageFiles.length} 张图片 · 首次加载约需 3–8 秒下载识别引擎</div></div>
                        </div>
                        <div class="modal-body" id="ocrBody">
                            <div id="ocrThumbList" style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;"></div>
                            <div class="ocr-progress">
                                <span id="ocrPct">0%</span>
                                <div class="bar"><span id="ocrBar"></span></div>
                            </div>
                            <div id="ocrStatus" style="font-size:12px;color:var(--gray-5);">准备中…</div>
                        </div>
                    </div>
                `;
                document.body.appendChild(mask);

                const allChapters = [];
                const allThumbs = [];
                let processed = 0;
                let failed = 0;

                const updateProgress = () => {
                    const total = imageFiles.length;
                    const pct = Math.round((processed / total) * 100);
                    const bar = mask.querySelector('#ocrBar');
                    const txt = mask.querySelector('#ocrPct');
                    const st = mask.querySelector('#ocrStatus');
                    if (bar) bar.style.width = pct + '%';
                    if (txt) txt.textContent = pct + '%';
                    if (st) st.textContent = `正在识别第 ${processed + 1}/${total} 张…`;
                };

                const thumbList = mask.querySelector('#ocrThumbList');

                for (const file of imageFiles) {
                    const thumbUrl = await new Promise(resolve => {
                        const r = new FileReader();
                        r.onload = () => resolve(r.result);
                        r.readAsDataURL(file);
                    });
                    allThumbs.push(thumbUrl);
                    if (thumbList) {
                        const img = document.createElement('img');
                        img.src = thumbUrl;
                        img.className = 'chapter-preview-thumb';
                        img.style.maxWidth = '80px';
                        img.style.maxHeight = '50px';
                        thumbList.appendChild(img);
                    }
                    updateProgress();
                    try {
                        const text = await runOcr(file, () => {});
                        const chapters = parseChaptersFromText(text);
                        allChapters.push(...chapters);
                    } catch (err) {
                        failed++;
                        console.error('[章节图OCR] 单张失败:', file.name, err);
                    }
                    processed++;
                    updateProgress();
                }

                mask.remove();
                showChapterModal(allThumbs, allChapters);

                if (allChapters.length === 0) {
                    showToast('⚠️ 未识别到章节行，请在弹窗中手动填写或修正', 'info', 3500);
                } else {
                    const msg = `✅ 识别到 ${allChapters.length} 个章节` + (imageFiles.length > 1 ? `（共处理 ${imageFiles.length} 张图${failed ? `，${failed} 张失败` : ''}）` : '') + `，请核对后点击「确认匹配」`;
                    showToast(msg, 'success', 3200);
                }
            }

            // ===== 下载 ZIP =====
            async function downloadZip() {
                if (fileItems.length === 0) {
                    showToast('⚠️ 没有文件可下载', 'error');
                    return;
                }
                if (!isJSZipReady()) {
                    showToast('❌ JSZip 库未加载，请刷新重试', 'error', 4000);
                    return;
                }

                // 检查空标题
                const emptyTitles = fileItems.filter(it => !it.title.trim());
                if (emptyTitles.length > 0) {
                    const names = emptyTitles.map(it => it.originalName).join('、');
                    if (!confirm(`以下文件的标题为空，继续下载吗？\n\n${names}`)) {
                        return;
                    }
                }

                const btn = document.querySelector('#btnDownloadZip, #btnDownloadZipBig');
                const originalText = btn ? btn.textContent : '下载';
                if (btn) { btn.disabled = true;
                    btn.textContent = '⏳ 打包中...'; }

                try {
                    const zip = new JSZip();
                    for (const item of fileItems) {
                        try {
                            const newName = generateNewName(item);
                            const arrayBuffer = await item.file.arrayBuffer();
                            // 保留原始目录结构，用新文件名替换原文件名
                            let zipPath = newName;
                            if (item.relativePath && item.relativePath.indexOf('/') > 0) {
                                const parts = item.relativePath.split('/');
                                const dirs = parts.slice(0, -1);
                                zipPath = dirs.join('/') + '/' + newName;
                            }
                            zip.file(zipPath, arrayBuffer);
                        } catch (err) {
                            console.warn('读取失败:', item.originalName, err);
                            showToast(`⚠️ 读取失败: ${item.originalName}`, 'error', 2000);
                        }
                    }
                    const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = '重命名文件_' + new Date().toISOString().slice(0, 10) + '.zip';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    setTimeout(() => URL.revokeObjectURL(link.href), 5000);
                    showToast(`✅ 下载成功！共 ${fileItems.length} 个文件`, 'success', 3000);
                } catch (err) {
                    console.error(err);
                    showToast('❌ 打包失败: ' + err.message, 'error', 4000);
                } finally {
                    if (btn) { btn.disabled = false;
                        btn.textContent = originalText; }
                }
            }

            // ============================================================
            // 核心：写入文件内容 —— 原封不动地把原始文件的二进制字节拷过去，只改文件名
            // ============================================================
            /**
             * 读取原始 File 对象为 ArrayBuffer（一字节不差地拷贝）
             */
            function readRawBytes(fileObj) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);  // ArrayBuffer
                    reader.onerror = () => reject(reader.error || new Error('读取文件失败'));
                    reader.readAsArrayBuffer(fileObj);
                });
            }

            /**
             * 完整性校验：比较原始大小和实际写入大小
             */
            function verifySize(originalSize, writtenSize, newName) {
                if (writtenSize !== originalSize) {
                    throw new Error(`内容大小不一致（原 ${originalSize} B → 实际写入 ${writtenSize} B），文件可能损坏，已中止`);
                }
            }

            /**
             * 保存单个文件到用户选择的文件夹（优先 FSA API，不支持时降级为单独下载）
             * 内容原封不动，仅更改文件名。
             * @param {string} id fileItems 中的 id
             * @param {FileSystemDirectoryHandle} [reuseDirHandle] 批量保存时复用已选目录，避免重复弹窗
             * @param {boolean} [silent] 静默模式：不弹单个文件的成功 toast（由批量统一显示）
             * @returns {Promise<{success:boolean,error?:string,item:object,newName:string}>}
             */
            async function saveSingleFile(id, reuseDirHandle, silent, forceNewDir) {
                const item = fileItems.find(it => it.id === id);
                if (!item) return { success: false, error: '文件不存在', item: null, newName: '' };
                const newName = generateNewName(item);
                const originalSize = item.file.size;

                try {
                    // 更新状态
                    item.saveStatus = 'saving';
                    item.saveError = '';
                    renderList();

                    if (reuseDirHandle || isFsaSupported()) {
                        let dirHandle = reuseDirHandle;
                        // 没有复用的目录句柄时，让用户选一次
                        // forceNewDir=true 时强制重新选择（处理句柄失效导致的 NotFoundError 重试场景）
                        if (!dirHandle || forceNewDir) {
                            dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
                        }
                        // 如果是文件夹上传的文件，按原相对路径递归创建子目录
                        // relativePath 形如 "章节1/子目录/01.pptx"；最后一段是文件名，前面都是目录
                        if (item.relativePath && item.relativePath.indexOf('/') > 0) {
                            const parts = item.relativePath.split('/');
                            const subdirs = parts.slice(0, -1);  // 去掉最后一段文件名
                            for (const sub of subdirs) {
                                if (!sub) continue;
                                // { create: true } 不存在则创建，存在则获取；不会覆盖内容
                                dirHandle = await dirHandle.getDirectoryHandle(sub, { create: true });
                            }
                        }
                        const arrayBuffer = await readRawBytes(item.file);
                        const fileHandle = await dirHandle.getFileHandle(newName, { create: true });
                        const writable = await fileHandle.createWritable();
                        await writable.write({ type: 'write', data: arrayBuffer });
                        await writable.close();
                        // 完整性检查：读取写入后的文件大小
                        try {
                            const writtenStat = await fileHandle.getFile();
                            verifySize(originalSize, writtenStat.size, newName);
                        } catch (verifyErr) {
                            throw verifyErr;
                        }
                        item.saveStatus = 'success';
                        item.saveError = '';
                        if (!silent) showToast(`✅ 已保存：${newName}`, 'success', 1800);
                        renderList();
                        return { success: true, item, newName };
                    } else {
                        // 降级：单独触发 <a download> 下载
                        const arrayBuffer = await readRawBytes(item.file);
                        verifySize(originalSize, arrayBuffer.byteLength, newName);
                        const blob = new Blob([arrayBuffer], { type: item.file.type || 'application/octet-stream' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = newName;
                        a.style.display = 'none';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        setTimeout(() => URL.revokeObjectURL(url), 3000);
                        item.saveStatus = 'success';
                        item.saveError = '';
                        if (!silent) showToast(`✅ 已触发下载：${newName}`, 'success', 1800);
                        renderList();
                        return { success: true, item, newName };
                    }
                } catch (err) {
                    console.error('[saveSingleFile] 失败:', item.originalName, err);
                    let errMsg = (err && err.message) ? err.message : String(err || '未知错误');
                    // 用户取消选择目录不算失败
                    if (err && err.name === 'AbortError') {
                        item.saveStatus = 'idle';
                        item.saveError = '';
                        renderList();
                        return { success: false, error: '已取消', item, newName, aborted: true };
                    }
                    // InvalidStateError / NotFoundError：目录句柄缓存状态失效
                    // 典型错误信息："An operation that depends on state cached in an interface object was made but the state had changed since it was read from disk."
                    const isStateError = err && (
                        err.name === 'NotFoundError' ||
                        err.name === 'InvalidStateError' ||
                        (err.message && err.message.includes('state cached in an interface object'))
                    );
                    if (isStateError && reuseDirHandle) {
                        errMsg = '目录句柄已失效，请点击重试重新选择文件夹';
                    }
                    item.saveStatus = 'fail';
                    item.saveError = errMsg;
                    renderList();
                    if (!silent) {
                        showToast(`❌ 保存失败：${item.originalName}\n原因：${errMsg}`, 'error', 4000);
                    }
                    return { success: false, error: errMsg, item, newName };
                }
            }

            /**
             * 显示失败详情弹窗（列出每个失败文件 + 原因 + 单独重试按钮）
             * @param {Array<{success:boolean,error?:string,item:object,newName:string}>} failList
             * @param {FileSystemDirectoryHandle} [dirHandle] 可选，用于重试时复用目录
             * @param {boolean} [downloadMode] 是否为逐个下载模式（而非 FSA 写入模式）
             */
            function showFailDetailModal(failList, dirHandle, downloadMode) {
                // 已有的话先移除
                const oldMask = document.querySelector('.fail-detail-modal-mask');
                if (oldMask) oldMask.remove();

                const itemsHtml = failList.map(f => {
                    const origName = f.item ? f.item.originalName : '未知文件';
                    const newName = f.newName || '';
                    const err = f.error || '未知错误';
                    const itemId = f.item ? f.item.id : '';
                    return `
                        <div class="fail-item">
                            <div class="fail-name">原始：${origName}</div>
                            <div class="fail-newname">目标：${newName}</div>
                            <span class="fail-reason">❌ ${err}</span>
                            <div class="fail-actions">
                                <button class="btn btn-primary btn-sm" data-retry-id="${itemId}">🔁 重试这一个</button>
                            </div>
                        </div>
                    `;
                }).join('');

                const mask = document.createElement('div');
                mask.className = 'fail-detail-modal-mask';
                mask.innerHTML = `
                    <div class="fail-detail-modal">
                        <div class="modal-header">
                            <h3>⚠️ ${failList.length} 个文件保存失败</h3>
                            <button class="modal-close" title="关闭">×</button>
                        </div>
                        <div class="modal-body">
                            ${itemsHtml}
                            <div style="margin-top:8px; padding:10px 12px; background:var(--gray-1); border-radius:8px; font-size:12px; color:var(--gray-5);">
                                💡 你也可以关闭此弹窗，在文件列表中直接点击失败行的「💾 单独保存」按钮或左侧红色圆圈 ⚠️ 重新保存。
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-outline" data-retry-all>🔁 重试全部失败项</button>
                            <button class="btn btn-primary" data-close-modal>知道了</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(mask);

                // 绑定关闭
                const close = () => mask.remove();
                mask.addEventListener('click', e => { if (e.target === mask) close(); });
                mask.querySelector('.modal-close').addEventListener('click', close);
                mask.querySelector('[data-close-modal]').addEventListener('click', close);

                // 单个重试
                mask.querySelectorAll('[data-retry-id]').forEach(btn => {
                    btn.addEventListener('click', async function() {
                        const id = this.dataset.retryId;
                        if (!id) return;
                        this.disabled = true;
                        const oldText = this.textContent;
                        this.textContent = '⏳ 重试中...';
                        // 重试策略：
                        // 1. 先用原 dirHandle 重试（不强制选目录，因为点击事件算用户手势）
                        // 2. 如果仍然报 InvalidStateError/NotFoundError，自动再试一次（forceNewDir 重新选目录）
                        let result = await saveSingleFile(id, dirHandle, false);
                        if (!result.success && result.error && (
                            result.error.includes('缓存状态') ||
                            result.error.includes('失效') ||
                            result.error.includes('state cached')
                        )) {
                            // 句柄确实失效了，强制重新选目录再试一次
                            result = await saveSingleFile(id, null, false, true);
                        }
                        this.disabled = false;
                        this.textContent = oldText;
                        if (result.success) {
                            const newFailList = failList.filter(f => f.item && f.item.id !== id);
                            if (newFailList.length === 0) {
                                close();
                                showToast('🎉 已全部重传成功', 'success', 2500);
                            } else {
                                failList.length = 0;
                                failList.push(...newFailList);
                                close();
                                showFailDetailModal(newFailList, null, downloadMode);
                            }
                        }
                    });
                });

                // 重试全部
                mask.querySelector('[data-retry-all]').addEventListener('click', async function() {
                    this.disabled = true;
                    const oldText = this.textContent;
                    this.textContent = '⏳ 重试全部中...';
                    const stillFail = [];
                    // forceNewDir=true：重试时强制重新选择目录（解决句柄失效 NotFoundError）
                    // 先让用户选一次目录，然后复用这个新句柄
                    let freshDirHandle = null;
                    try {
                        freshDirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
                    } catch (e) {
                        if (e && e.name === 'AbortError') {
                            this.disabled = false;
                            this.textContent = oldText;
                            return;
                        }
                    }
                    for (const f of failList) {
                        if (!f.item) continue;
                        const r = await saveSingleFile(f.item.id, freshDirHandle, true);
                        if (!r.success && !r.aborted) stillFail.push(r);
                    }
                    this.disabled = false;
                    this.textContent = oldText;
                    close();
                    if (stillFail.length === 0) {
                        showToast('🎉 重试全部成功', 'success', 2500);
                    } else {
                        showToast(`仍有 ${stillFail.length} 个失败，详见弹窗`, 'error', 2500);
                        showFailDetailModal(stillFail, freshDirHandle, downloadMode);
                    }
                });
            }

            /**
             * 检测浏览器是否支持 File System Access API（可直接写入用户选择的文件夹）
             */
            function isFsaSupported() {
                return typeof window !== 'undefined' &&
                    typeof window.showDirectoryPicker === 'function';
            }

            /**
             * 降级方案：逐个文件用 <a download> 触发浏览器下载
             * 文件会落到浏览器的「下载」文件夹（或用户另存为选择的路径）
             */
            async function downloadFilesOneByOne() {
                if (fileItems.length === 0) {
                    showToast('⚠️ 没有文件可下载', 'error');
                    return;
                }
                // 检查空标题
                const emptyTitles = fileItems.filter(it => !it.title.trim());
                if (emptyTitles.length > 0) {
                    const names = emptyTitles.map(it => it.originalName).join('、');
                    if (!confirm(`以下文件的标题为空，继续下载吗？\n\n${names}`)) {
                        return;
                    }
                }
                if (!confirm(`将逐个下载 ${fileItems.length} 个文件到浏览器的「下载」文件夹。\n\n如果想保存到自己指定的文件夹（例如桌面），请使用 Chrome 或 Edge 浏览器重新打开本页，它支持直接选择目标文件夹。\n\n是否继续？`)) {
                    return;
                }
                const btn = document.querySelector('#btnSaveFolder, #btnSaveFolderBig');
                const originalText = btn ? btn.textContent : '保存到文件夹';
                if (btn) { btn.disabled = true; btn.textContent = '⏳ 逐个下载中...'; }
                const failList = [];
                let ok = 0;
                try {
                    for (let i = 0; i < fileItems.length; i++) {
                        const item = fileItems[i];
                        const result = await saveSingleFile(item.id, null, true);
                        if (result.success) {
                            ok++;
                        } else if (!result.aborted) {
                            failList.push(result);
                        }
                        // 每个文件之间留点间隔，避免浏览器拦截多次下载
                        await new Promise(r => setTimeout(r, 180));
                    }
                    const fail = failList.length;
                    if (fail > 0) {
                        showToast(`⚠️ 完成：${ok} 个成功，${fail} 个失败 → 详见下方弹窗`, 'error', 4500);
                        showFailDetailModal(failList, null, true);
                    } else {
                        showToast(`✅ 已触发 ${ok} 个文件下载。请在浏览器「下载」文件夹中查看。`, 'success', 4000);
                    }
                } catch (err) {
                    console.error(err);
                    showToast('❌ 下载失败: ' + err.message, 'error', 4000);
                } finally {
                    if (btn) { btn.disabled = false; btn.textContent = originalText; }
                }
            }

            /**
             * 保存到文件夹：优先使用 File System Access API 直接写入用户指定目录
             * 不支持则降级为逐个下载
             */
            async function saveToFolder() {
                if (fileItems.length === 0) {
                    showToast('⚠️ 没有文件可下载', 'error');
                    return;
                }
                // 检查空标题
                const emptyTitles = fileItems.filter(it => !it.title.trim());
                if (emptyTitles.length > 0) {
                    const names = emptyTitles.map(it => it.originalName).join('、');
                    if (!confirm(`以下文件的标题为空，继续保存吗？\n\n${names}`)) {
                        return;
                    }
                }

                if (!isFsaSupported()) {
                    // 不支持 FSA，用降级方案
                    await downloadFilesOneByOne();
                    return;
                }

                const btn = document.querySelector('#btnSaveFolder, #btnSaveFolderBig');
                const originalText = btn ? btn.textContent : '保存到文件夹';
                if (btn) { btn.disabled = true; btn.textContent = '⏳ 请选择文件夹...'; }

                try {
                    // 让用户选择一个目标文件夹
                    const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
                    if (btn) btn.textContent = '⏳ 写入文件中...';
                    const failList = [];
                    let ok = 0;
                    let aborted = false;
                    for (let i = 0; i < fileItems.length; i++) {
                        const item = fileItems[i];
                        // 复用已选目录句柄，每个文件不再弹选择框
                        const result = await saveSingleFile(item.id, dirHandle, true);
                        if (result.success) {
                            ok++;
                        } else if (result.aborted) {
                            aborted = true;
                            break;
                        } else {
                            failList.push(result);
                        }
                    }
                    const fail = failList.length;
                    const hasRelativePath = fileItems.some(it => it.relativePath && it.relativePath.indexOf('/') > 0);
                    if (aborted) {
                        // 单个保存不会触发 AbortError（除非目录选择取消，那已经在 saveSingleFile 捕获了）
                    }
                    if (fail > 0) {
                        showToast(`⚠️ 已保存 ${ok} 个到你选的文件夹，但有 ${fail} 个失败 → 详见弹窗`, 'error', 4500);
                        showFailDetailModal(failList, dirHandle, false);
                    } else if (hasRelativePath) {
                        showToast(`🎉 已保存全部 ${ok} 个文件，按原文件夹结构保留了子目录！`, 'success', 4000);
                    } else {
                        showToast(`🎉 已保存全部 ${ok} 个文件到你选的文件夹！`, 'success', 3500);
                    }
                } catch (err) {
                    // 用户取消选择文件夹不算错误
                    if (err && err.name === 'AbortError') {
                        showToast('已取消选择文件夹', 'info', 1500);
                    } else {
                        console.error(err);
                        // 权限问题或其他错误 → 降级为逐个下载
                        showToast('⚠️ 无法写入所选文件夹，改用逐个下载方式…', 'info', 2500);
                        await downloadFilesOneByOne();
                        return;
                    }
                } finally {
                    if (btn) { btn.disabled = false; btn.textContent = originalText; }
                }
            }

            // ===== 事件绑定 =====
            // 拖拽状态标记：防止拖拽结束后误触发 click
            let isDragging = false;
            let dragMoved = false;
            
            uploadArea.addEventListener('dragstart', function() {
                isDragging = true;
                dragMoved = false;
            });
            
            uploadArea.addEventListener('dragenter', function(e) {
                isDragging = true;
                if (e.buttons === 0) dragMoved = true;
            });
            
            uploadArea.addEventListener('dragend', function() {
                // 延迟重置，让 click 事件有机会被拦截
                setTimeout(() => {
                    isDragging = false;
                    dragMoved = false;
                }, 500);
            });
            
            // 点击上传区域触发文件选择（但拖拽后的 click 要被拦截）
            uploadArea.addEventListener('click', function(e) {
                // 如果是拖拽后的 click，忽略
                if (isDragging || dragMoved) {
                    console.log('[click] 拖拽状态，忽略');
                    return;
                }
                // 如果点击的是 folderPickerBtn，让它自己的处理器处理
                if (e.target.id === 'folderPickerBtn' || e.target.closest('#folderPickerBtn')) {
                    e.stopPropagation();
                    return;
                }
                // 如果点击的是选择文件夹标签，不触发 fileInput
                if (e.target.tagName === 'LABEL' && e.target.getAttribute('for') === 'folderInput') {
                    return;
                }
                fileInput.click();
            });

            fileInput.addEventListener('change', function() {
                if (this.files && this.files.length > 0) {
                    addFiles(this.files);
                    this.value = '';
                }
            });

            // ===== 文件夹选择：双方案实现 =====
            var folderPickerBtn = document.getElementById('folderPickerBtn');
            
            // 方案1：File System Access API（更可靠） - 仅当按钮存在时
            if (folderPickerBtn && 'showDirectoryPicker' in window) {
                folderPickerBtn.addEventListener('click', async function(e) {
                    e.stopPropagation(); // 阻止冒泡到 uploadArea
                    try {
                        const dirHandle = await window.showDirectoryPicker({ mode: 'read' });
                        const files = [];
                        const rootName = dirHandle.name;
                        
                        async function traverse(h, path) {
                            for await (const [name, handle] of h.entries()) {
                                if (handle.kind === 'file') {
                                    const file = await handle.getFile();
                                    const fileWithPath = new File([file], name, { type: file.type });
                                    Object.defineProperty(fileWithPath, 'webkitRelativePath', {
                                        value: path + '/' + name
                                    });
                                    files.push(fileWithPath);
                                } else if (handle.kind === 'directory') {
                                    await traverse(handle, path + '/' + name);
                                }
                            }
                        }
                        
                        await traverse(dirHandle, rootName);
                        console.log('[showDirectoryPicker] 读取到', files.length, '个文件');
                        
                        if (files.length > 0) {
                            addFiles(files);
                            showToast('📂 已添加 ' + files.length + ' 个文件（可再次点击添加更多文件夹）', 'success', 2500);
                        } else {
                            showToast('⚠️ 文件夹为空', 'warning', 3000);
                        }
                    } catch (err) {
                        if (err.name !== 'AbortError') {
                            console.error('[showDirectoryPicker] 错误:', err);
                            showToast('❌ 读取失败: ' + err.message, 'error', 3000);
                        }
                    }
                });
            } else if (folderPickerBtn) {
                // 不支持 showDirectoryPicker，隐藏主按钮
                folderPickerBtn.style.display = 'none';
                console.warn('[showDirectoryPicker] 浏览器不支持File System Access API');
            }
            
            // 方案2：旧版 webkitdirectory（兼容）
            folderInput.addEventListener('change', function() {
                console.log('[folderInput] change, files.length =', this.files ? this.files.length : 0);
                if (this.files && this.files.length > 0) {
                    addFiles(this.files);
                    showToast('📂 已添加 ' + this.files.length + ' 个文件（旧版模式）', 'success', 2500);
                    setTimeout(function() { folderInput.value = ''; }, 200);
                } else {
                    showToast('⚠️ 未检测到文件，请使用上面的新版按钮', 'warning', 3000);
                }
            });

            // ===== 拖拽处理 =====
            function handleDrop(e) {
                console.log('========== handleDrop 触发 ==========');
                console.log('e.target:', e.target);
                const dt = e.dataTransfer;
                if (!dt) {
                    console.error('dataTransfer 为空！');
                    showToast('❌ 拖拽事件数据丢失，请重试', 'error', 2000);
                    return;
                }
                
                const items = dt.items;
                const files = dt.files;
                console.log('items.length:', items ? items.length : 0);
                console.log('files.length:', files ? files.length : 0);
                if (files && files.length > 0) {
                    console.log('files[0]:', files[0].name, 'size:', files[0].size);
                }
                
                // === 核心逻辑：优先用 items + webkitGetAsEntry 递归读取文件夹 ===
                // 这样可以同时处理多个文件夹拖拽（每个文件夹独立递归）
                if (items && items.length > 0) {
                    const entryList = [];
                    let hasFileEntry = false;
                    for (let i = 0; i < items.length; i++) {
                        const it = items[i];
                        if (it.kind !== 'file') continue;
                        const entry = it.webkitGetAsEntry ? it.webkitGetAsEntry() : null;
                        if (entry) {
                            entryList.push(entry);
                            hasFileEntry = true;
                            console.log('[drop] entry[' + i + ']:', entry.name, 'isDir:', entry.isDirectory);
                        }
                    }
                    
                    if (hasFileEntry) {
                        const outputFiles = [];
                        
                        // 带超时的读取（多文件夹同时递归）
                        const readWithTimeout = new Promise((resolve) => {
                            const timeout = setTimeout(() => {
                                console.warn('[drop] 读取超时(10秒)，返回已读文件:', outputFiles.length);
                                resolve();
                            }, 10000);
                            
                            Promise.all(entryList.map(entry => {
                                if (entry.isDirectory) {
                                    // 文件夹：递归读取，prefix 用文件夹名（作为顶层 sourceFolder）
                                    // 传入 dt.files 作为兜底：Edge readEntries 失败时用 webkitRelativePath 恢复
                                    return traverseDirectoryWithTimeout(entry, outputFiles, entry.name, files);
                                } else if (entry.isFile) {
                                    // 单个文件：读取并设置 webkitRelativePath
                                    return new Promise(r => {
                                        try {
                                            entry.file(f => {
                                                // 为拖拽的文件设置 webkitRelativePath（拖拽场景原生无此属性）
                                                try {
                                                    Object.defineProperty(f, 'webkitRelativePath', {
                                                        value: f.name,
                                                        configurable: true
                                                    });
                                                } catch (_) {}
                                                outputFiles.push(f);
                                                r();
                                            }, () => r());
                                        } catch (_) { r(); }
                                    });
                                }
                                return Promise.resolve();
                            })).then(() => {
                                clearTimeout(timeout);
                                resolve();
                            }).catch(() => {
                                clearTimeout(timeout);
                                resolve();
                            });
                        });
                        
                        readWithTimeout.then(() => {
                            console.log('[drop] 读取完成，files.length =', outputFiles.length);
                            if (outputFiles.length > 0) {
                                addFiles(outputFiles);
                                showToast(`📂 已添加 ${outputFiles.length} 个文件（来自 ${entryList.length} 个文件夹）`, 'success', 2000);
                            } else {
                                // 降级：entries 读取失败（Edge 中文路径 EncodingError）
                                // 用 dt.files + webkitRelativePath 做兜底（Edge 拖拽时 dt.files 包含所有文件）
                                console.warn('[drop] entries 读取失败，尝试 dt.files + webkitRelativePath 降级');
                                const realFiles = [];
                                const virtualFolders = [];
                                if (files && files.length > 0) {
                                    for (let i = 0; i < files.length; i++) {
                                        const f = files[i];
                                        // 关键：用 webkitRelativePath 判定——有这个属性且含斜杠 = 文件
                                        const hasWRP = f.webkitRelativePath && f.webkitRelativePath.length > 0;
                                        const hasExt = f.name && /\.[^.\\/]+$/.test(f.name);
                                        const hasMime = f.type && f.type.length > 0;
                                        // 文件夹特征：无 webkitRelativePath + size=0 + 无扩展名 + 无 MIME
                                        const isLikelyFile = hasWRP || f.size > 0 || hasExt || hasMime;
                                        if (isLikelyFile) {
                                            realFiles.push(f);
                                        } else {
                                            virtualFolders.push(f.name);
                                        }
                                    }
                                }
                                if (realFiles.length > 0) {
                                    addFiles(realFiles);
                                    showToast(`📂 已添加 ${realFiles.length} 个文件（降级模式）`, 'success', 2000);
                                } else if (virtualFolders.length > 0) {
                                    showToast(`❌ Edge浏览器Bug：无法读取中文路径文件夹「${virtualFolders.join(', ')}」的内容。请点击 【📁 选择文件夹】 按钮替代拖拽`, 'error', 8000);
                                } else {
                                    showToast('⚠️ 拖拽的文件夹读取失败，请点击「📁 选择文件夹」按钮', 'error', 5000);
                                }
                            }
                        });
                        return;
                    }
                }
                
                // === 降级：items 不可用，直接用 dt.files ===
                if (files && files.length > 0) {
                    const realFiles = [];
                    for (let i = 0; i < files.length; i++) {
                        const f = files[i];
                        const hasWRP = f.webkitRelativePath && f.webkitRelativePath.length > 0;
                        const hasExt = f.name && /\.[^.\\/]+$/.test(f.name);
                        const hasMime = f.type && f.type.length > 0;
                        if (hasWRP || f.size > 0 || hasExt || hasMime) {
                            realFiles.push(f);
                        }
                    }
                    if (realFiles.length > 0) {
                        addFiles(realFiles);
                        showToast(`📂 已添加 ${realFiles.length} 个文件`, 'success', 1500);
                    } else {
                        showToast('⚠️ 只检测到文件夹本身，请拖拽文件夹内的文件或点击按钮选择', 'error', 4000);
                    }
                    return;
                }
                
                showToast('⚠️ 未检测到可拖拽的文件，请重试', 'error', 2000);
            }
            
            // 带超时的目录遍历（Edge 中中文文件夹名会导致 readEntries 报 EncodingError）
            // 修复策略：readEntries 失败时改用 dt.files 中的 webkitRelativePath 来恢复
            function traverseDirectoryWithTimeout(entry, files, prefix, topLevelFiles) {
                return new Promise(resolve => {
                    const timeout = setTimeout(() => {
                        console.warn('[traverseDirectory] 子目录超时:', prefix);
                        resolve();
                    }, 5000);
                    
                    try {
                        const reader = entry.createReader();
                        const allEntries = [];
                        let stopped = false;
                        let hasError = false;
                        
                        function readBatch() {
                            if (stopped) return;
                            try {
                                reader.readEntries((entries) => {
                                    if (!entries || entries.length === 0) {
                                        stopped = true;
                                        processAndResolve();
                                        return;
                                    }
                                    for (const e of entries) allEntries.push(e);
                                    readBatch();
                                }, (err) => {
                                    // Edge 中中文文件夹名会触发 EncodingError
                                    if (err && err.name === 'EncodingError') {
                                        console.warn('[traverseDirectory] EncodingError (Edge中文路径bug):', prefix);
                                        hasError = true;
                                    } else {
                                        console.warn('[traverseDirectory] readEntries 错误:', err);
                                        hasError = true;
                                    }
                                    stopped = true;
                                    processAndResolve();
                                });
                            } catch (e) {
                                stopped = true;
                                hasError = true;
                                console.warn('[traverseDirectory] readEntries 异常:', e);
                                processAndResolve();
                            }
                        }
                        
                        async function processAndResolve() {
                            clearTimeout(timeout);
                            // readEntries 失败：用 dt.files 的 webkitRelativePath 兜底恢复
                            if (allEntries.length === 0 && hasError) {
                                console.log('[traverseDirectory] readEntries 失败，尝试用 topLevelFiles 兜底');
                                if (topLevelFiles && topLevelFiles.length > 0) {
                                    // 从 topLevelFiles 中筛选出属于这个目录的文件
                                    const matched = [];
                                    for (const f of topLevelFiles) {
                                        if (f.webkitRelativePath && f.webkitRelativePath.indexOf(prefix + '/') === 0) {
                                            matched.push(f);
                                        }
                                    }
                                    console.log('[traverseDirectory] 兜底匹配到', matched.length, '个文件');
                                    for (const f of matched) {
                                        files.push(f);
                                    }
                                }
                                resolve();
                                return;
                            }
                            
                            const promises = [];
                            for (const ent of allEntries) {
                                if (ent.isDirectory) {
                                    promises.push(traverseDirectoryWithTimeout(ent, files, prefix + '/' + ent.name, topLevelFiles));
                                } else if (ent.isFile) {
                                    promises.push(new Promise(r => {
                                        try {
                                            ent.file(f => {
                                                // 关键：为拖拽场景的文件设置 webkitRelativePath
                                                // 拖拽的 File 对象原生无此属性，必须手动设置
                                                // 格式：顶层文件夹名/子目录/文件名（与 webkitdirectory 一致）
                                                const relativePath = prefix + '/' + (f.name || ent.name);
                                                try {
                                                    Object.defineProperty(f, 'webkitRelativePath', {
                                                        value: relativePath,
                                                        configurable: true
                                                    });
                                                } catch (_) {
                                                    // 如果不能定义属性，用包装对象
                                                    const wrapper = {
                                                        name: f.name,
                                                        size: f.size,
                                                        type: f.type,
                                                        lastModified: f.lastModified,
                                                        webkitRelativePath: relativePath
                                                    };
                                                    // 复制 File 原型方法
                                                    wrapper.arrayBuffer = f.arrayBuffer.bind(f);
                                                    wrapper.slice = f.slice.bind(f);
                                                    wrapper.stream = f.stream.bind(f);
                                                    wrapper.text = f.text.bind(f);
                                                    files.push(wrapper);
                                                    r();
                                                    return;
                                                }
                                                files.push(f);
                                                r();
                                            }, () => r());
                                        } catch (_) { r(); }
                                    }));
                                }
                            }
                            await Promise.all(promises);
                            resolve();
                        }
                        
                        readBatch();
                    } catch (e) {
                        clearTimeout(timeout);
                        resolve();
                    }
                });
            }

            // uploadArea 上的拖拽事件（文件可能不经过这里，作为兜底）
            uploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                e.stopPropagation();
                e.dataTransfer.dropEffect = 'copy';
                this.classList.add('dragover');
                // 标记为拖拽中（防止 click 误触发）
                isDragging = true;
                dragMoved = true;
            });
            uploadArea.addEventListener('dragenter', function(e) {
                e.preventDefault();
                e.stopPropagation();
                this.classList.add('dragover');
                // 标记为拖拽中
                isDragging = true;
                dragMoved = true;
            });
            uploadArea.addEventListener('dragleave', function(e) {
                e.preventDefault();
                e.stopPropagation();
                this.classList.remove('dragover');
            });
            uploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                e.stopPropagation();
                this.classList.remove('dragover');
                // drop 后立即重置拖拽状态
                isDragging = false;
                dragMoved = false;
                handleDrop(e);
            });

            btnClearAll.addEventListener('click', clearAll);
            btnDownloadZip.addEventListener('click', downloadZip);
            btnDownloadZipBig.addEventListener('click', downloadZip);
            applyGlobalBtn.addEventListener('click', applyGlobalToAll);
            btnAutoIndex.addEventListener('click', applyAutoIndex);
            btnFixedIndex.addEventListener('click', applyFixedIndex);
            btnFixedIndexNoInc.addEventListener('click', applyFixedIndexNoIncrement);
            // 回车快捷触发固定格式编号
            fixedIndexPattern.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    applyFixedIndex();
                }
            });
            btnAutoCategory.addEventListener('click', applyAutoCategory);
            btnSuffixNumber.addEventListener('click', showSuffixModal);
            btnSaveFolder.addEventListener('click', saveToFolder);
            btnSaveFolderBig.addEventListener('click', saveToFolder);

            // 简化序号开关：变化时重新渲染
            const simplifyIndexCheckbox = document.getElementById('simplifyIndex');
            if (simplifyIndexCheckbox) {
                simplifyIndexCheckbox.addEventListener('change', function() {
                    renderList();
                });
            }

            // 章节截图拖拽区：点击选择 + 拖拽图片
            chapterDropZone.addEventListener('click', function(e) {
                if (e.target === chapterImageInput) return;
                chapterImageInput.click();
            });
            chapterImageInput.addEventListener('change', function() {
                if (this.files && this.files.length > 0) {
                    handleChapterImages(Array.from(this.files));
                    this.value = '';
                }
            });
            chapterDropZone.addEventListener('dragover', function(e) {
                e.preventDefault();
                this.classList.add('dragover');
            });
            chapterDropZone.addEventListener('dragleave', function(e) {
                e.preventDefault();
                this.classList.remove('dragover');
            });
            chapterDropZone.addEventListener('drop', function(e) {
                e.preventDefault();
                this.classList.remove('dragover');
                const files = e.dataTransfer && e.dataTransfer.files;
                if (files && files.length > 0) {
                    handleChapterImages(Array.from(files));
                }
            });
            chapterDropZone.addEventListener('dragenter', function(e) {
                e.preventDefault();
            });

            // 全局拦截拖拽默认行为，防止浏览器直接打开文件
            // 但不阻止上传区的 drop 事件
            document.addEventListener('dragover', function(e) {
                e.preventDefault();
            });
            document.addEventListener('drop', function(e) {
                // 如果事件目标是上传区或其子元素，不阻止（让 uploadArea 的处理器处理）
                if (uploadArea.contains(e.target)) {
                    // 上传区已处理，不做任何事
                    return;
                }
                // 其他区域阻止默认行为
                e.preventDefault();
            });

            // 快捷键 Ctrl+Enter 下载
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    downloadZip();
                }
            });

            // ===== 初始化 =====
            renderList();

            // JSZip 加载检测
            if (!isJSZipReady()) {
                showToast('⏳ 加载 JSZip 库...', 'info', 3000);
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
                script.onload = () => showToast('✅ JSZip 就绪', 'success', 1500);
                script.onerror = () => showToast('❌ JSZip 加载失败，请刷新', 'error', 4000);
                document.head.appendChild(script);
            }

            // 浏览器兼容性提示（不支持直接选文件夹时告知）
            setTimeout(() => {
                if (!isFsaSupported()) {
                    showToast('💡 建议使用 Chrome 或 Edge 打开本页，可直接选择保存到哪个文件夹',
                        'info', 4500);
                }
            }, 1200);

            console.log('📂 批量重命名工具（规范版）已启动 v2.7.4（循环提取嵌套括号）');
            console.log('✏️ 可编辑序号、标题、类别、附加，预览实时更新');
            console.log('💡 Ctrl+Enter 快速下载；"保存到文件夹"按钮可无需打包直接写入目标目录');
        })();
    </script>
</body>
</html>
